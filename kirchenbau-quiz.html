<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1a1410">
    <link rel="manifest" href="manifest.json">
    <title>⛪ Bauhütte – Romanik & Gotik</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        :root {
            --bg-dark: #1a1410;
            --bg-card: #ffffff;
            --gold: #F5C842;
            --gold-deep: #c99a1f;
            --romanik: #b8662f;
            --romanik-light: #f4e3d0;
            --romanik-deep: #6b3a14;
            --gotik: #3a5a9c;
            --gotik-light: #d8e1f3;
            --gotik-deep: #1f3666;
            --text: #1a1410;
            --text-mute: #6b7280;
            --border: #e5e7eb;
            --green: #22c55e;
            --green-light: #dcfce7;
            --red: #ef4444;
            --red-light: #fee2e2;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            background: var(--bg-dark);
            color: white;
            overflow-x: hidden;
        }

        /* Background scenery per screen */
        #homeScreen { background: linear-gradient(160deg, #2a1f17 0%, #1a1410 70%); }
        .quiz-bg-romanik { background: linear-gradient(165deg, #6b3a14 0%, #2a1f17 100%); }
        .quiz-bg-gotik { background: linear-gradient(165deg, #1f3666 0%, #1a1410 100%); }
        .quiz-bg-mix { background: linear-gradient(165deg, #6b3a14 0%, #1f3666 100%); }

        .screen { display: none; min-height: 100vh; padding: 24px 16px 32px; }
        .screen.active { display: flex; flex-direction: column; align-items: center; }
        .inner { max-width: 480px; width: 100%; margin: 0 auto; }

        /* Home */
        .home-header { text-align: center; padding: 32px 0 16px; }
        .crest {
            width: 72px; height: 72px; margin: 0 auto 14px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, var(--gold) 0%, var(--gold-deep) 100%);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 8px 24px rgba(245,200,66,0.3);
            font-size: 38px;
        }
        h1 { font-size: 32px; font-weight: 900; letter-spacing: -0.5px; margin-bottom: 4px; }
        .home-subtitle { color: rgba(255,255,255,0.55); font-size: 14px; margin-bottom: 4px; }
        .home-tagline { color: var(--gold); font-size: 13px; font-weight: 600; letter-spacing: 0.3px; margin-bottom: 24px; }

        /* XP / Streak strip */
        .stats-strip {
            display: flex; gap: 8px; margin-bottom: 20px;
        }
        .stat-pill {
            flex: 1;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 14px;
            padding: 10px 12px;
            display: flex; align-items: center; gap: 8px;
        }
        .stat-icon { font-size: 18px; }
        .stat-content { flex: 1; min-width: 0; }
        .stat-label { font-size: 10px; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; }
        .stat-value { font-size: 15px; font-weight: 800; color: white; line-height: 1.2; }
        .xp-bar-wrap { margin-top: 4px; height: 4px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; }
        .xp-bar-fill { height: 100%; background: var(--gold); border-radius: 4px; transition: width 0.5s ease; }

        /* Bereich cards */
        .section-label {
            font-size: 11px; font-weight: 800; letter-spacing: 1.5px;
            color: rgba(255,255,255,0.5); text-transform: uppercase;
            margin: 8px 4px 10px;
        }
        .bereich-row { display: flex; flex-direction: column; gap: 12px; margin-bottom: 8px; }
        .bereich-card {
            background: var(--bg-card); border-radius: 22px;
            padding: 0; overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.15s ease;
        }
        .bereich-card:active { transform: scale(0.985); }
        .bereich-header {
            padding: 16px 18px 12px;
            display: flex; align-items: center; gap: 14px;
        }
        .bereich-card.romanik .bereich-header { background: linear-gradient(135deg, var(--romanik) 0%, var(--romanik-deep) 100%); color: white; }
        .bereich-card.gotik .bereich-header { background: linear-gradient(135deg, var(--gotik) 0%, var(--gotik-deep) 100%); color: white; }
        .bereich-card.mix .bereich-header { background: linear-gradient(135deg, var(--romanik) 0%, var(--gotik) 100%); color: white; }
        .bereich-icon {
            width: 44px; height: 44px; border-radius: 12px;
            background: rgba(255,255,255,0.2);
            display: flex; align-items: center; justify-content: center;
            font-size: 22px;
        }
        .bereich-title { font-size: 18px; font-weight: 800; line-height: 1.1; }
        .bereich-subtitle { font-size: 12px; opacity: 0.85; margin-top: 2px; }
        .bereich-body {
            padding: 12px 14px 14px;
            display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
        }
        .thema-chip {
            background: #f9fafb; border: 1px solid var(--border);
            border-radius: 12px; padding: 9px 10px;
            font-size: 11.5px; font-weight: 700; color: var(--text);
            display: flex; align-items: center; gap: 6px;
            cursor: pointer;
            transition: all 0.12s ease;
        }
        .thema-chip:active { transform: scale(0.96); background: #f1f1f1; }
        .thema-chip .chip-emoji { font-size: 14px; }
        .bereich-full-btn {
            margin: 0 14px 14px; padding: 11px;
            background: var(--text); color: white;
            font-size: 13px; font-weight: 700;
            border: none; border-radius: 12px; cursor: pointer;
            font-family: inherit;
            display: flex; align-items: center; justify-content: center; gap: 6px;
            width: calc(100% - 28px);
        }
        .bereich-full-btn:active { transform: scale(0.98); }

        /* Footer */
        .home-footer {
            margin-top: 20px; padding: 14px;
            font-size: 11px; color: rgba(255,255,255,0.35);
            text-align: center; line-height: 1.5;
        }
        .reset-link { color: rgba(255,255,255,0.45); text-decoration: underline; cursor: pointer; }

        /* Quiz screen */
        #quizScreen .inner { padding-top: 8px; }
        .quiz-top {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 12px; color: white; font-size: 12px; font-weight: 600;
        }
        .quiz-back {
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15);
            color: white; border-radius: 99px; padding: 6px 12px;
            cursor: pointer; font-family: inherit; font-size: 12px; font-weight: 600;
        }
        .quiz-progress-text { opacity: 0.7; }
        .prog-track {
            width: 100%; height: 8px;
            background: rgba(255,255,255,0.15); border-radius: 99px; overflow: hidden;
            margin-bottom: 16px;
        }
        .prog-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--gold) 0%, #ffe27a 100%);
            border-radius: 99px; transition: width 0.4s ease; width: 0%;
        }
        .quiz-card {
            background: var(--bg-card); color: var(--text);
            border-radius: 24px; padding: 22px 20px;
            box-shadow: 0 16px 48px rgba(0,0,0,0.4);
        }
        .stil-pill {
            display: inline-flex; align-items: center; gap: 6px;
            border-radius: 99px; padding: 4px 12px;
            font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.6px;
            margin-bottom: 14px;
        }
        .stil-pill.romanik { background: var(--romanik-light); color: var(--romanik-deep); }
        .stil-pill.gotik { background: var(--gotik-light); color: var(--gotik-deep); }
        .mech-pill {
            display: inline-flex; align-items: center; gap: 4px;
            border-radius: 99px; padding: 3px 10px;
            font-size: 10px; font-weight: 700; letter-spacing: 0.3px;
            background: #f3f4f6; color: #6b7280; margin-left: 6px; margin-bottom: 14px;
        }
        .question-text {
            font-size: 16.5px; font-weight: 700; color: var(--text);
            line-height: 1.4; margin-bottom: 16px;
        }
        .question-text .luecke {
            display: inline-block; min-width: 60px;
            border-bottom: 2px dashed #9ca3af;
            color: #9ca3af; padding: 0 6px;
            font-weight: 800;
        }
        .question-text .luecke.filled { border-bottom-style: solid; color: var(--text); }

        .hint-svg-wrap {
            background: #f9fafb; border-radius: 14px; padding: 12px;
            margin-bottom: 14px; display: flex; justify-content: center;
            min-height: 100px;
        }
        .hint-svg-wrap svg { max-width: 100%; height: auto; max-height: 160px; }

        /* Answer buttons (text MC) */
        .answers { display: flex; flex-direction: column; gap: 9px; margin-bottom: 14px; }
        .answer-btn {
            width: 100%; background: #f9fafb; border: 2px solid var(--border);
            border-radius: 14px; padding: 13px 14px;
            display: flex; align-items: center; gap: 12px;
            cursor: pointer; text-align: left; font-family: inherit;
            transition: border-color 0.15s, background 0.15s, transform 0.1s;
            color: var(--text);
        }
        .answer-btn:active:not(:disabled) { transform: scale(0.98); }
        .answer-btn:disabled { cursor: default; }
        .answer-btn.a-correct { background: var(--green-light) !important; border-color: var(--green) !important; }
        .answer-btn.a-wrong { background: var(--red-light) !important; border-color: var(--red) !important; }
        .answer-btn.a-dimmed { opacity: 0.45; }
        .ans-letter {
            width: 28px; height: 28px; border-radius: 50%; background: #e5e7eb;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: 800; color: #374151; flex-shrink: 0;
        }
        .ans-text { flex: 1; font-size: 14px; font-weight: 600; color: var(--text); line-height: 1.3; }
        .ans-icon { font-size: 18px; flex-shrink: 0; min-width: 20px; }

        /* Bild-MC: 2x2 grid of images */
        .answers-bild {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px;
        }
        .answer-bild-btn {
            background: #f9fafb; border: 2px solid var(--border);
            border-radius: 14px; padding: 10px;
            cursor: pointer; font-family: inherit;
            display: flex; flex-direction: column; align-items: center; gap: 6px;
            transition: all 0.15s ease;
        }
        .answer-bild-btn:active:not(:disabled) { transform: scale(0.97); }
        .answer-bild-btn:disabled { cursor: default; }
        .answer-bild-btn.a-correct { background: var(--green-light) !important; border-color: var(--green) !important; }
        .answer-bild-btn.a-wrong { background: var(--red-light) !important; border-color: var(--red) !important; }
        .answer-bild-btn.a-dimmed { opacity: 0.4; }
        .answer-bild-btn svg { max-width: 100%; height: 70px; }
        .answer-bild-btn .bild-label { font-size: 12px; font-weight: 700; color: var(--text); text-align: center; }

        /* Stil-Sortierer (2 large buttons) */
        .answers-stil {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px;
        }
        .stil-btn {
            border: 2px solid var(--border);
            border-radius: 16px; padding: 16px 12px;
            cursor: pointer; font-family: inherit;
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            transition: all 0.15s ease;
            font-size: 15px; font-weight: 800;
        }
        .stil-btn:active:not(:disabled) { transform: scale(0.97); }
        .stil-btn:disabled { cursor: default; }
        .stil-btn.s-romanik { background: var(--romanik-light); color: var(--romanik-deep); border-color: var(--romanik); }
        .stil-btn.s-gotik { background: var(--gotik-light); color: var(--gotik-deep); border-color: var(--gotik); }
        .stil-btn.a-correct::after { content: "✓"; font-size: 16px; color: var(--green); }
        .stil-btn.a-wrong::after { content: "✗"; font-size: 16px; color: var(--red); }
        .stil-btn.a-dimmed { opacity: 0.4; }
        .stil-btn small { font-size: 11px; font-weight: 600; opacity: 0.7; text-transform: none; letter-spacing: 0; }

        /* Wahr/Falsch (2 buttons) */
        .answers-wf {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px;
        }
        .wf-btn {
            border: 2px solid var(--border); background: #f9fafb;
            border-radius: 14px; padding: 18px;
            cursor: pointer; font-family: inherit;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: all 0.15s ease;
            font-size: 16px; font-weight: 800; color: var(--text);
        }
        .wf-btn:active:not(:disabled) { transform: scale(0.97); }
        .wf-btn:disabled { cursor: default; }
        .wf-btn.a-correct { background: var(--green-light) !important; border-color: var(--green) !important; }
        .wf-btn.a-wrong { background: var(--red-light) !important; border-color: var(--red) !important; }
        .wf-btn.a-dimmed { opacity: 0.4; }

        /* Beschriften: Bild mit Hotspots oben, Optionen unten */
        .beschriften-image-wrap {
            background: #f9fafb; border-radius: 14px; padding: 16px;
            margin-bottom: 14px; position: relative;
        }
        .hotspot {
            position: absolute;
            width: 30px; height: 30px;
            border-radius: 50%;
            background: var(--gold); color: var(--text);
            border: 2px solid white;
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 800;
            box-shadow: 0 2px 8px rgba(0,0,0,0.25);
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        .hotspot.target {
            background: var(--text); color: var(--gold);
            animation: pulse 1.4s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.18); }
        }

        /* Feedback */
        .feedback-box {
            border-radius: 14px; padding: 14px; margin-bottom: 14px;
            border: 1px solid; display: none;
            animation: fadeUp 0.25s ease;
        }
        .feedback-box.show { display: block; }
        .fb-correct { background: #f0fdf4; border-color: #86efac; }
        .fb-wrong { background: #fef2f2; border-color: #fca5a5; }
        .fb-title { font-size: 14px; font-weight: 800; margin-bottom: 6px; color: var(--text); }
        .fb-correct .fb-title { color: #15803d; }
        .fb-wrong .fb-title { color: #b91c1c; }
        .fb-fact { font-size: 13px; color: #374151; line-height: 1.5; }

        /* Next button */
        .btn-next {
            width: 100%;
            background: linear-gradient(90deg, var(--gold) 0%, var(--gold-deep) 100%);
            color: var(--text);
            font-size: 15px; font-weight: 800;
            padding: 14px; border: none; border-radius: 14px;
            cursor: pointer;
            display: none; align-items: center; justify-content: center; gap: 6px;
            font-family: inherit; animation: fadeUp 0.25s ease;
        }
        .btn-next.show { display: flex; }
        .btn-next:active { transform: scale(0.98); }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* End screen */
        #endScreen .inner { padding-top: 32px; }
        .end-card {
            background: white; color: var(--text);
            border-radius: 24px; padding: 28px 22px;
            text-align: center;
            box-shadow: 0 16px 48px rgba(0,0,0,0.3);
        }
        .end-emoji { font-size: 64px; margin-bottom: 8px; line-height: 1; }
        .end-title { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
        .end-subtitle { color: var(--text-mute); font-size: 14px; margin-bottom: 18px; }
        .end-stats {
            display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;
            margin-bottom: 20px;
        }
        .end-stat {
            background: #f9fafb; border-radius: 12px; padding: 10px;
        }
        .end-stat-value { font-size: 20px; font-weight: 800; color: var(--text); }
        .end-stat-label { font-size: 10px; color: var(--text-mute); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; margin-top: 2px; }
        .end-actions { display: flex; flex-direction: column; gap: 8px; }
        .btn-primary {
            background: linear-gradient(90deg, var(--gold) 0%, var(--gold-deep) 100%);
            color: var(--text);
            font-size: 15px; font-weight: 800;
            padding: 14px; border: none; border-radius: 14px;
            cursor: pointer; font-family: inherit;
            display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .btn-primary:active { transform: scale(0.98); }
        .btn-secondary {
            background: transparent;
            color: var(--text-mute);
            font-size: 13px; font-weight: 700;
            padding: 10px; border: none; border-radius: 14px;
            cursor: pointer; font-family: inherit;
        }

        /* Confetti */
        .confetti-wrap {
            position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 100;
        }
        .confetto {
            position: absolute; top: -20px;
            width: 10px; height: 14px;
            opacity: 0.95;
            animation: confettiFall linear forwards;
        }
        @keyframes confettiFall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0.5; }
        }

        /* Streak burst */
        .streak-burst {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-deep) 100%);
            color: var(--text);
            padding: 16px 26px; border-radius: 20px;
            font-size: 18px; font-weight: 800;
            box-shadow: 0 12px 40px rgba(245,200,66,0.5);
            z-index: 200; pointer-events: none;
            animation: burstAnim 1.3s ease forwards;
        }
        @keyframes burstAnim {
            0% { transform: translate(-50%, -50%) scale(0) rotate(-10deg); opacity: 0; }
            20% { transform: translate(-50%, -50%) scale(1.1) rotate(3deg); opacity: 1; }
            40% { transform: translate(-50%, -50%) scale(1) rotate(0deg); }
            85% { transform: translate(-50%, -60%) scale(1) rotate(0deg); opacity: 1; }
            100% { transform: translate(-50%, -80%) scale(0.95) rotate(0deg); opacity: 0; }
        }

        /* XP gain pop */
        .xp-pop {
            position: fixed; bottom: 30%; left: 50%;
            transform: translateX(-50%);
            background: rgba(26,20,16,0.92);
            color: var(--gold);
            padding: 10px 18px; border-radius: 99px;
            font-size: 15px; font-weight: 800;
            z-index: 150; pointer-events: none;
            animation: xpPopAnim 1.4s ease forwards;
        }
        @keyframes xpPopAnim {
            0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
            15% { opacity: 1; transform: translateX(-50%) translateY(0); }
            85% { opacity: 1; transform: translateX(-50%) translateY(-30px); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-50px); }
        }
    </style>
</head>
<body>

<!-- HOME -->
<div id="homeScreen" class="screen active">
    <div class="inner">
        <div class="home-header">
            <div class="crest">⛪</div>
            <h1>Bauhütte</h1>
            <div class="home-subtitle">Kirchenbau im Mittelalter</div>
            <div class="home-tagline">Romanik · Gotik</div>
        </div>

        <div class="stats-strip">
            <div class="stat-pill">
                <div class="stat-icon">⭐</div>
                <div class="stat-content">
                    <div class="stat-label">XP</div>
                    <div class="stat-value" id="xpValue">0</div>
                    <div class="xp-bar-wrap"><div class="xp-bar-fill" id="xpBarFill" style="width:0%"></div></div>
                </div>
            </div>
            <div class="stat-pill">
                <div class="stat-icon">🔥</div>
                <div class="stat-content">
                    <div class="stat-label">Streak</div>
                    <div class="stat-value"><span id="streakValue">0</span> <small style="font-size:11px; font-weight:600; opacity:0.6;">Tage</small></div>
                </div>
            </div>
        </div>

        <div class="section-label">Wähle einen Stil</div>
        <div class="bereich-row" id="bereichRow"></div>

        <div class="home-footer">
            Alle Module sind frei spielbar – keine Reihenfolge.<br>
            <span class="reset-link" onclick="resetProgress()">Fortschritt zurücksetzen</span>
        </div>
    </div>
</div>

<!-- QUIZ -->
<div id="quizScreen" class="screen">
    <div class="inner">
        <div class="quiz-top">
            <button class="quiz-back" onclick="goHome()">← Zurück</button>
            <span class="quiz-progress-text"><span id="qNow">1</span> / <span id="qTotal">10</span></span>
        </div>
        <div class="prog-track"><div class="prog-fill" id="progFill"></div></div>
        <div class="quiz-card">
            <div id="quizCardContent"></div>
        </div>
    </div>
</div>

<!-- END -->
<div id="endScreen" class="screen">
    <div class="inner">
        <div class="end-card">
            <div class="end-emoji" id="endEmoji">🏆</div>
            <div class="end-title" id="endTitle">Geschafft!</div>
            <div class="end-subtitle" id="endSubtitle">Du hast die Runde abgeschlossen.</div>
            <div class="end-stats">
                <div class="end-stat">
                    <div class="end-stat-value" id="endScore">0/0</div>
                    <div class="end-stat-label">Richtig</div>
                </div>
                <div class="end-stat">
                    <div class="end-stat-value" id="endXp">+0</div>
                    <div class="end-stat-label">XP</div>
                </div>
                <div class="end-stat">
                    <div class="end-stat-value" id="endBest">–</div>
                    <div class="end-stat-label">Beste %</div>
                </div>
            </div>
            <div class="end-actions">
                <button class="btn-primary" onclick="retryRound()">↻ Nochmal</button>
                <button class="btn-secondary" onclick="goHome()">Zurück zur Übersicht</button>
            </div>
        </div>

let state = {
    xp: 0,
    streakDays: 0,
    lastPlayDate: null,
    bestByMode: {}
};

let session = {
    mode: null,            // e.g. 'romanik:aussenbau' or 'romanik:all' or 'mix:all'
    questions: [],
    currentIdx: 0,
    correct: 0,
    answered: 0,
    xpThisRound: 0
};

function loadState() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) state = { ...state, ...JSON.parse(raw) };
    } catch (e) {}
    updateStreak();
    renderHomeStats();
}

function saveState() {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {}
}

function todayStr() {
    return new Date().toISOString().slice(0, 10);
}

function updateStreak() {
    const today = todayStr();
    if (state.lastPlayDate === today) {
        // streak already counted today
        return;
    }
    if (state.lastPlayDate) {
        const lastDate = new Date(state.lastPlayDate);
        const todayDate = new Date(today);
        const diffDays = Math.round((todayDate - lastDate) / 86400000);
        if (diffDays > 1) {
            state.streakDays = 0;
        }
    }
}

function bumpStreakOnPlay() {
    const today = todayStr();
    if (state.lastPlayDate !== today) {
        state.streakDays = (state.streakDays || 0) + 1;
        state.lastPlayDate = today;
        saveState();
        showStreakBurst();
    }
}

function resetProgress() {
    if (!confirm('Wirklich Fortschritt zurücksetzen? XP, Streak und Bestleistungen werden gelöscht.')) return;
    state = { xp: 0, streakDays: 0, lastPlayDate: null, bestByMode: {} };
    saveState();
    renderHomeStats();
}

function renderHomeStats() {
    document.getElementById('xpValue').textContent = state.xp;
    document.getElementById('streakValue').textContent = state.streakDays;
    // XP-Bar zeigt Fortschritt zum nächsten "Level" (alle 100 XP)
    const xpInLevel = state.xp % 100;
    document.getElementById('xpBarFill').style.width = xpInLevel + '%';
}

/* =====================================================
   HOME UI
   ===================================================== */
const BEREICHE = [
    {
        key: 'romanik',
        cls: 'romanik',
        icon: '🏰',
        title: 'Romanik',
        subtitle: '950 – 1250 · Burg Gottes',
        themen: [
            { key: 'aussenbau', emoji: '🏛️', label: 'Außenbau' },
            { key: 'grundriss', emoji: '📐', label: 'Innenraum' },
            { key: 'konstruktion', emoji: '🧱', label: 'Konstruktion' },
            { key: 'kontext', emoji: '📜', label: 'Geschichte' }
        ]
    },
    {
        key: 'gotik',
        cls: 'gotik',
        icon: '⛪',
        title: 'Gotik',
        subtitle: '1250 – 1400 · Himmlische Stadt',
        themen: [
            { key: 'aussenbau', emoji: '🏛️', label: 'Außenbau' },
            { key: 'grundriss', emoji: '📐', label: 'Innenraum' },
            { key: 'konstruktion', emoji: '🧱', label: 'Konstruktion' },
            { key: 'masswerk', emoji: '🌹', label: 'Maßwerk' },
            { key: 'kontext', emoji: '📜', label: 'Geschichte' }
        ]
    },
    {
        key: 'mix',
        cls: 'mix',
        icon: '🔀',
        title: 'Mix – Vergleich',
        subtitle: 'Romanik & Gotik durcheinander',
        themen: []
    }
];

function renderHome() {
    const row = document.getElementById('bereichRow');
    row.innerHTML = '';
    BEREICHE.forEach(b => {
        const card = document.createElement('div');
        card.className = `bereich-card ${b.cls}`;
        let themenHtml = '';
        if (b.themen.length) {
            themenHtml = `<div class="bereich-body">` +
                b.themen.map(t =>
                    `<button class="thema-chip" onclick="startRound('${b.key}', '${t.key}')"><span class="chip-emoji">${t.emoji}</span><span>${t.label}</span></button>`
                ).join('') +
                `</div>`;
        }
        card.innerHTML = `
            <div class="bereich-header">
                <div class="bereich-icon">${b.icon}</div>
                <div style="flex:1; min-width:0;">
                    <div class="bereich-title">${b.title}</div>
                    <div class="bereich-subtitle">${b.subtitle}</div>
                </div>
            </div>
            ${themenHtml}
            <button class="bereich-full-btn" onclick="startRound('${b.key}', 'all')">▶ Alles spielen</button>
        `;
        row.appendChild(card);
    });
}

/* =====================================================
   ROUND
   ===================================================== */
function startRound(bereich, thema) {
    let pool = [];
    if (bereich === 'mix') {
        // Mix: alle Fragen, ordentlich gemischt
        pool = QUESTIONS.slice();
    } else {
        pool = QUESTIONS.filter(q => q.bereich === bereich || (q.bereich === 'mix' && bereich !== 'mix'));
        if (thema !== 'all') {
            // Filter auf thema, aber nur innerhalb des gewählten Stils (also nicht Mix-Fragen wenn ein konkreter Stil läuft)
            pool = pool.filter(q => q.bereich === bereich && q.thema === thema);
        } else {
            // 'all' für romanik oder gotik: nur diesen Stil, ohne Mix-Fragen
            pool = pool.filter(q => q.bereich === bereich);
        }
    }

    if (pool.length === 0) {
        alert('Keine Fragen verfügbar.');
        return;
    }

    // Shuffle and limit
    const shuffled = shuffle(pool);
    const limit = (bereich === 'mix' || thema === 'all') ? Math.min(12, shuffled.length) : shuffled.length;
    session = {
        mode: `${bereich}:${thema}`,
        questions: shuffled.slice(0, limit),
        currentIdx: 0,
        correct: 0,
        answered: 0,
        xpThisRound: 0
    };

    bumpStreakOnPlay();
    showScreen('quizScreen');
    applyQuizBg(bereich);
    renderQuestion();
}

function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

function applyQuizBg(bereich) {
    const s = document.getElementById('quizScreen');
    s.classList.remove('quiz-bg-romanik', 'quiz-bg-gotik', 'quiz-bg-mix');
    if (bereich === 'romanik') s.classList.add('quiz-bg-romanik');
    else if (bereich === 'gotik') s.classList.add('quiz-bg-gotik');
    else s.classList.add('quiz-bg-mix');
}

function renderQuestion() {
    const q = session.questions[session.currentIdx];
    document.getElementById('qNow').textContent = session.currentIdx + 1;
    document.getElementById('qTotal').textContent = session.questions.length;
    document.getElementById('progFill').style.width = ((session.currentIdx) / session.questions.length * 100) + '%';

    const stil = (q.bereich === 'mix') ? null : q.bereich;
    const stilLabel = stil === 'romanik' ? 'Romanik' : stil === 'gotik' ? 'Gotik' : 'Vergleich';
    const stilClass = stil === 'romanik' ? 'romanik' : stil === 'gotik' ? 'gotik' : 'romanik';

    const mechLabel = {
        mc: 'Frage',
        bild: 'Bilder-Quiz',
        wf: 'Wahr / Falsch',
        stil: 'Stil zuordnen',
        luecke: 'Lückentext',
        beschriften: 'Beschriften'
    }[q.typ] || 'Frage';

    let html = `<span class="stil-pill ${stilClass}">${q.bereich === 'mix' ? '⚖️' : '⛪'} ${stilLabel}</span>`;
    html += `<span class="mech-pill">${mechLabel}</span>`;

    // Hint-SVG (zusätzliche Visualisierung)
    if (q.hintSvg && SVGS[q.hintSvg]) {
        html += `<div class="hint-svg-wrap">${SVGS[q.hintSvg]}</div>`;
    }

    // Frage-Text mit eventueller Lücke
    let frageHtml = q.frage;
    if (q.typ === 'luecke') {
        frageHtml = q.frage.replace('___', '<span class="luecke" id="lueckeSpan">___</span>');
    }
    html += `<div class="question-text">${frageHtml}</div>`;

    if (q.hintText) {
        html += `<div class="hint-svg-wrap" style="font-style:italic; color:#374151; min-height:auto; padding:14px; font-size:14px; text-align:center;">„${q.hintText}"</div>`;
    }

    // Antwortbereich je nach Mechanik
    if (q.typ === 'mc' || q.typ === 'luecke') {
        html += `<div class="answers" id="answersWrap">` +
            q.optionen.map((opt, i) => `
                <button class="answer-btn" data-idx="${i}" onclick="answerMC(${i})">
                    <span class="ans-letter">${String.fromCharCode(65 + i)}</span>
                    <span class="ans-text">${opt}</span>
                    <span class="ans-icon"></span>
                </button>
            `).join('') + `</div>`;
    } else if (q.typ === 'bild') {
        html += `<div class="answers-bild" id="answersWrap">` +
            q.optionen.map((opt, i) => `
                <button class="answer-bild-btn" data-idx="${i}" onclick="answerMC(${i})">
                    ${SVGS[opt.svg] || ''}
                    <span class="bild-label">${opt.label}</span>
                </button>
            `).join('') + `</div>`;
    } else if (q.typ === 'wf') {
        html += `<div class="answers-wf" id="answersWrap">
            <button class="wf-btn" data-val="true" onclick="answerWF(true)">✓ Wahr</button>
            <button class="wf-btn" data-val="false" onclick="answerWF(false)">✗ Falsch</button>
        </div>`;
    } else if (q.typ === 'stil') {
        html += `<div class="answers-stil" id="answersWrap">
            <button class="stil-btn s-romanik" data-val="romanik" onclick="answerStil('romanik')">🏰 Romanik<small>950–1250</small></button>
            <button class="stil-btn s-gotik" data-val="gotik" onclick="answerStil('gotik')">⛪ Gotik<small>1250–1400</small></button>
        </div>`;
    }

    // Feedback + Next placeholder
    html += `<div class="feedback-box" id="feedbackBox">
        <div class="fb-title" id="fbTitle"></div>
        <div class="fb-fact" id="fbFact"></div>
    </div>`;
    html += `<button class="btn-next" id="btnNext" onclick="nextQuestion()">Weiter →</button>`;

    document.getElementById('quizCardContent').innerHTML = html;
}

/* ---------- Answering ---------- */
function answerMC(idx) {
    const q = session.questions[session.currentIdx];
    const correct = idx === q.korrekt;
    const btns = document.querySelectorAll('#answersWrap .answer-btn, #answersWrap .answer-bild-btn');
    btns.forEach((b, i) => {
        b.disabled = true;
        const dataIdx = parseInt(b.dataset.idx, 10);
        if (dataIdx === q.korrekt) {
            b.classList.add('a-correct');
            const icon = b.querySelector('.ans-icon');
            if (icon) icon.textContent = '✓';
        } else if (dataIdx === idx) {
            b.classList.add('a-wrong');
            const icon = b.querySelector('.ans-icon');
            if (icon) icon.textContent = '✗';
        } else {
            b.classList.add('a-dimmed');
        }
    });

    // Lücke füllen (kosmetisch)
    if (q.typ === 'luecke') {
        const luecke = document.getElementById('lueckeSpan');
        if (luecke) {
            luecke.textContent = q.optionen[q.korrekt];
            luecke.classList.add('filled');
        }
    }

    finishQuestion(correct, q);
}

function answerWF(val) {
    const q = session.questions[session.currentIdx];
    const correct = (val === q.korrekt);
    document.querySelectorAll('#answersWrap .wf-btn').forEach(b => {
        b.disabled = true;
        const v = b.dataset.val === 'true';
        if (v === q.korrekt) b.classList.add('a-correct');
        else if (v === val) b.classList.add('a-wrong');
        else b.classList.add('a-dimmed');
    });
    finishQuestion(correct, q);
}

function answerStil(val) {
    const q = session.questions[session.currentIdx];
    const correct = (val === q.korrekt);
    document.querySelectorAll('#answersWrap .stil-btn').forEach(b => {
        b.disabled = true;
        const v = b.dataset.val;
        if (v === q.korrekt) b.classList.add('a-correct');
        else if (v === val) b.classList.add('a-wrong');
        else b.classList.add('a-dimmed');
    });
    finishQuestion(correct, q);
}

function finishQuestion(correct, q) {
    session.answered++;
    if (correct) {
        session.correct++;
        const gain = 10;
        session.xpThisRound += gain;
        state.xp += gain;
        saveState();
        renderHomeStats();
        showXpPop(gain);
    }

    const fb = document.getElementById('feedbackBox');
    fb.classList.remove('fb-correct', 'fb-wrong');
    fb.classList.add(correct ? 'fb-correct' : 'fb-wrong');
    document.getElementById('fbTitle').textContent = correct ? '✓ Richtig!' : '✗ Knapp daneben';
    document.getElementById('fbFact').textContent = q.erklaerung;
    fb.classList.add('show');
    document.getElementById('btnNext').classList.add('show');
}

function nextQuestion() {
    session.currentIdx++;
    if (session.currentIdx >= session.questions.length) {
        endRound();
    } else {
        renderQuestion();
    }
}

/* ---------- End Round ---------- */
function endRound() {
    const total = session.questions.length;
    const pct = Math.round((session.correct / total) * 100);

    // Best tracking
    const prev = state.bestByMode[session.mode] || 0;
    if (pct > prev) {
        state.bestByMode[session.mode] = pct;
        saveState();
    }

    let emoji, title, sub;
    if (pct === 100) { emoji = '🏆'; title = 'Meisterbau!'; sub = 'Alle Antworten richtig – wie ein gotischer Werkmeister.'; launchConfetti(80); }
    else if (pct >= 80) { emoji = '🌟'; title = 'Stark!'; sub = 'Fast perfekt. Du hast den Stil verstanden.'; launchConfetti(40); }
    else if (pct >= 60) { emoji = '😊'; title = 'Gut gemacht!'; sub = 'Solides Wissen – noch ein wenig schleifen.'; }
    else { emoji = '🛠️'; title = 'Weiterbauen!'; sub = 'Bauhütte sagt: nochmal üben lohnt sich.'; }

    document.getElementById('endEmoji').textContent = emoji;
    document.getElementById('endTitle').textContent = title;
    document.getElementById('endSubtitle').textContent = sub;
    document.getElementById('endScore').textContent = `${session.correct}/${total}`;
    document.getElementById('endXp').textContent = `+${session.xpThisRound}`;
    document.getElementById('endBest').textContent = state.bestByMode[session.mode] + '%';
    showScreen('endScreen');
    applyEndBg();
}

function applyEndBg() {
    const [bereich] = session.mode.split(':');
    const s = document.getElementById('endScreen');
    s.className = 'screen active';
    if (bereich === 'romanik') s.classList.add('quiz-bg-romanik');
    else if (bereich === 'gotik') s.classList.add('quiz-bg-gotik');
    else s.classList.add('quiz-bg-mix');
}

function retryRound() {
    const [bereich, thema] = session.mode.split(':');
    startRound(bereich, thema);
}

/* ---------- Navigation ---------- */
function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    window.scrollTo(0, 0);
}

function goHome() {
    document.getElementById('quizScreen').classList.remove('quiz-bg-romanik', 'quiz-bg-gotik', 'quiz-bg-mix');
    document.getElementById('endScreen').classList.remove('quiz-bg-romanik', 'quiz-bg-gotik', 'quiz-bg-mix');
    showScreen('homeScreen');
    renderHomeStats();
}

/* ---------- Effects ---------- */
function launchConfetti(count) {
    const wrap = document.getElementById('confettiWrap');
    const colors = ['#F5C842', '#b8662f', '#3a5a9c', '#f4e3d0', '#d8e1f3', '#22c55e'];
    for (let i = 0; i < count; i++) {
        const c = document.createElement('div');
        c.className = 'confetto';
        c.style.left = Math.random() * 100 + 'vw';
        c.style.background = colors[Math.floor(Math.random() * colors.length)];
        c.style.animationDuration = (2 + Math.random() * 2) + 's';
        c.style.animationDelay = (Math.random() * 0.4) + 's';
        c.style.width = (6 + Math.random() * 8) + 'px';
        c.style.height = (10 + Math.random() * 8) + 'px';
        wrap.appendChild(c);
        setTimeout(() => c.remove(), 4500);
    }
}

function showXpPop(amount) {
    const pop = document.createElement('div');
    pop.className = 'xp-pop';
    pop.textContent = '+' + amount + ' XP';
    document.body.appendChild(pop);
    setTimeout(() => pop.remove(), 1500);
}

function showStreakBurst() {
    if (state.streakDays < 2) return; // erst ab 2 Tagen feiern
    const burst = document.createElement('div');
    burst.className = 'streak-burst';
    burst.textContent = `🔥 ${state.streakDays} Tage Streak!`;
    document.body.appendChild(burst);
    setTimeout(() => burst.remove(), 1400);
}

/* =====================================================
   BOOT
   ===================================================== */
loadState();
renderHome();
</script>
